<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой ритм сегодня — статистика</title>
<style>
:root{
  --bg:#FAF8F4; --card:#FFFDFA; --olive:#66714F; --olive-deep:#4E5842;
  --sand:#D9CFC0; --sand-soft:#EDE6DC; --ink:#3A3733; --ink-soft:#615B54; --ink-faint:#736D64;
  --serif:"Cormorant Garamond", Georgia, serif;
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 60px}
h1{font-family:var(--serif);font-weight:500;font-size:2.2rem;margin:0}
h2{font-family:var(--serif);font-weight:500;font-size:1.4rem;margin:34px 0 12px}
.lede{color:var(--ink-soft);margin:8px 0 0}
.note{
  margin-top:18px;padding:14px 16px;border-radius:14px;
  background:rgba(192,138,110,.12);border:1px solid rgba(192,138,110,.3);
  color:#6E4830;font-size:.9rem;
}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--sand-soft);border-radius:14px;overflow:hidden}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--sand-soft);font-size:.92rem}
th{background:#F4F5EF;font-weight:600;color:var(--olive-deep);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.pct{text-align:right;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--sand-soft);overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;background:var(--olive)}
.empty{padding:40px 0;text-align:center;color:var(--ink-faint)}
.muted{color:var(--ink-faint);font-size:.85rem}
.controls{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
button{
  font-family:var(--sans);font-size:.9rem;padding:10px 16px;border-radius:100px;
  border:1px solid var(--sand);background:var(--card);color:var(--olive-deep);cursor:pointer;
}
button:hover{background:var(--sand-soft)}
code{background:var(--sand-soft);padding:2px 6px;border-radius:5px;font-size:.86rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Статистика</h1>
  <p class="lede">Воронка использования «Мой ритм сегодня».</p>

  <div class="note" id="mode-note"></div>

  <h2>Воронка</h2>
  <div id="funnel"></div>

  <h2>По источникам</h2>
  <div id="sources"></div>

  <h2>Попадание результата</h2>
  <div id="fit"></div>

  <h2>Эффект рекомендаций</h2>
  <div id="effect"></div>

  <div class="controls">
    <button id="reload">Обновить</button>
    <button id="export">Скачать события в CSV</button>
  </div>
  <p class="muted" style="margin-top:20px">
    Что означает каждое событие и что именно уходит на сервер — в файле ANALYTICS.md.
  </p>
</div>

<script>
(function () {
"use strict";

/* Адрес приёмника статистики. Пока пусто — страница показывает события,
   накопленные в этом браузере: так можно проверить воронку на себе
   и на нескольких знакомых до подключения сервера. */
var CONFIG = { ENDPOINT: "", API_KEY: "" };

var FUNNEL = [
  { code: "OPEN",          title: "Открыли сайт" },
  { code: "START",         title: "Начали опрос" },
  { code: "RESULT",        title: "Дошли до результата" },
  { code: "TRY_TODAY",     title: "Решили попробовать" },
  { code: "EVENING_START", title: "Открыли вечерний check-in" },
  { code: "EVENING_DONE",  title: "Завершили вечерний check-in" },
  { code: "RETURN_D1",     title: "Вернулись на следующий день" },
  { code: "RETURN_D7",     title: "Пользуются через неделю" }
];

var FIT = [
  { code: "FIT_YES",    title: "Очень похоже" },
  { code: "FIT_PARTLY", title: "Частично" },
  { code: "FIT_NO",     title: "Совсем не похоже" }
];

var EFFECT = [
  { code: "HELPED",       title: "Стало легче" },
  { code: "NO_CHANGE",    title: "Особой разницы" },
  { code: "DID_NOT_FIT",  title: "Не подошло" }
];

var $ = function (s) { return document.querySelector(s); };

function localEvents() {
  try {
    return JSON.parse(window.localStorage.getItem("ritm.an.queue") || "[]");
  } catch (e) { return []; }
}

function remoteEvents() {
  var url = CONFIG.ENDPOINT + "?select=event,event_date,source";
  return window.fetch(url, {
    headers: { apikey: CONFIG.API_KEY, Authorization: "Bearer " + CONFIG.API_KEY }
  }).then(function (r) { return r.ok ? r.json() : []; })
    .then(function (rows) {
      return rows.map(function (r) { return { event: r.event, date: r.event_date, source: r.source }; });
    })
    .catch(function () { return []; });
}

function count(events, code, source) {
  return events.filter(function (e) {
    return e.event === code && (!source || e.source === source);
  }).length;
}

function renderFunnel(events) {
  var box = $("#funnel");
  var base = count(events, "OPEN") || 0;
  if (!events.length) { box.innerHTML = '<p class="empty">Событий пока нет.</p>'; return; }

  var rows = FUNNEL.map(function (step) {
    var n = count(events, step.code);
    var pct = base ? Math.round((n / base) * 100) : 0;
    return "<tr><td>" + step.title +
      '<div class="bar"><span style="width:' + pct + '%"></span></div></td>' +
      '<td class="num">' + n + "</td>" +
      '<td class="pct">' + pct + "%</td></tr>";
  }).join("");

  box.innerHTML = "<table><thead><tr><th>Шаг</th><th>Человек</th><th>От пришедших</th></tr></thead><tbody>" +
    rows + "</tbody></table>";
}

function renderSources(events) {
  var box = $("#sources");
  var sources = [];
  events.forEach(function (e) { if (sources.indexOf(e.source) < 0) sources.push(e.source); });
  if (!sources.length) { box.innerHTML = '<p class="empty">Пока нет данных.</p>'; return; }

  var head = "<tr><th>Источник</th><th>Открыли</th><th>Результат</th><th>Попробовали</th><th>Вечер</th><th>День 2</th><th>Неделя</th></tr>";
  var rows = sources.map(function (src) {
    return "<tr><td>" + src + "</td>" +
      '<td class="num">' + count(events, "OPEN", src) + "</td>" +
      '<td class="num">' + count(events, "RESULT", src) + "</td>" +
      '<td class="num">' + count(events, "TRY_TODAY", src) + "</td>" +
      '<td class="num">' + count(events, "EVENING_DONE", src) + "</td>" +
      '<td class="num">' + count(events, "RETURN_D1", src) + "</td>" +
      '<td class="num">' + count(events, "RETURN_D7", src) + "</td></tr>";
  }).join("");

  box.innerHTML = "<table><thead>" + head + "</thead><tbody>" + rows + "</tbody></table>";
}

function renderShares(events, list, boxId, emptyText) {
  var box = $(boxId);
  var total = list.reduce(function (sum, item) { return sum + count(events, item.code); }, 0);
  if (!total) { box.innerHTML = '<p class="empty">' + emptyText + "</p>"; return; }

  var rows = list.map(function (item) {
    var n = count(events, item.code);
    var pct = Math.round((n / total) * 100);
    return "<tr><td>" + item.title +
      '<div class="bar"><span style="width:' + pct + '%"></span></div></td>' +
      '<td class="num">' + n + "</td>" +
      '<td class="pct">' + pct + "%</td></tr>";
  }).join("");

  box.innerHTML = "<table><thead><tr><th>Ответ</th><th>Раз</th><th>Доля</th></tr></thead><tbody>" +
    rows + "</tbody></table><p class=\"muted\" style=\"margin-top:8px\">Всего ответов: " + total + "</p>";
}

function toCSV(events) {
  var lines = ["event,date,source"];
  events.forEach(function (e) { lines.push(e.event + "," + e.date + "," + e.source); });
  return lines.join("\n");
}

function render(events) {
  renderFunnel(events);
  renderSources(events);
  renderShares(events, FIT, "#fit", "Пока никто не оценил, насколько результат похож.");
  renderShares(events, EFFECT, "#effect", "Пока никто не оценил эффект рекомендаций.");

  $("#export").onclick = function () {
    var blob = new Blob([toCSV(events)], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ritm-events.csv";
    a.click();
  };
}

function load() {
  if (CONFIG.ENDPOINT) {
    $("#mode-note").textContent = "Данные читаются с сервера статистики.";
    remoteEvents().then(render);
  } else {
    $("#mode-note").innerHTML = "Сервер статистики ещё не подключён, поэтому показаны события, " +
      "накопленные <b>в этом браузере</b>. Так можно проверить воронку на себе и на нескольких " +
      "знакомых. После подключения приёмника заполните <code>CONFIG.ENDPOINT</code> в этом файле.";
    render(localEvents());
  }
}

$("#reload").onclick = load;
load();

})();
</script>
</body>
</html>
